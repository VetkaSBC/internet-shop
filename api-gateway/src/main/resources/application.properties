server.port=8080
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator = INFO
logging.level.org.springframework.cloud.gateway = TRACE

spring.cloud.gateway.server.webflux.routes[0].id=user-service-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=media-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/media/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service-carts
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/carts/**

spring.cloud.gateway.server.webflux.routes[3].id=order-service-orders
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[4].id=product-categories
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/categories/**
